name: mangabox
description: MangaBox - کمیک‌خوان آفلاین
publish_to: none
version: 2.0.0+2
environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  photo_view: ^0.15.0
  scrollable_positioned_list: ^0.3.8
  path_provider: ^2.1.0

flutter:
  uses-material-design: true
  fonts:
    - family: Waw
      fonts:
        - asset: assets/fonts/Waw-UltraLight.ttf
          weight: 100
        - asset: assets/fonts/Waw-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Waw-Light.ttf
          weight: 300
        - asset: assets/fonts/Waw-Regular.ttf
          weight: 400
        - asset: assets/fonts/Waw-Medium.ttf
          weight: 500
        - asset: assets/fonts/Waw-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Waw-Bold.ttf
          weight: 700
        - asset: assets/fonts/Waw-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Waw-Black.ttf
          weight: 900
